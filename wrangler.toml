name = "cybermusic"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# D1 binding — env.DB in Workers runtime, consumed by src/lib/db.ts via
# @cloudflare/next-on-pages getRequestContext. Fill database_id after running:
#   npx wrangler d1 create cybermusic
[[d1_databases]]
binding = "DB"
database_name = "cybermusic"
database_id = ""

# KV namespace for distributed rate-limiting. Fill id after running:
#   npx wrangler kv namespace create RATE_LIMIT_KV
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = ""
